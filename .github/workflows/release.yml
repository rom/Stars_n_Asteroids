name: Release

# Pushing a tag such as v1.0.0 tests, builds and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check that the tag matches the version in the code
        run: |
          code="$(make -s version)"
          if [ "$code" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match internal/version ($code)" >&2
            exit 1
          fi
      - name: Test
        run: make test
      - name: Build release archives
        run: make dist
      - name: Release notes
        run: awk -v v="## $GITHUB_REF_NAME" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/checksums.txt
          --title "Stars n Asteroids $GITHUB_REF_NAME"
          --notes-file notes.md --verify-tag
